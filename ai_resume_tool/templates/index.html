<!DOCTYPE html>
<html>
<head>
    <title>AI Resume Improver</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
    <h1>📄 AI Resume Improvement Tool</h1>
    <form method="POST">
        <textarea name="resume" placeholder="Paste your resume text here..."></textarea>
        <button type="submit">Improve Resume</button>
    </form>

    {% if suggestions %}
    <div class="result">
        <h3>Suggestions:</h3>
        <ul>
            {% for s in suggestions %}
            <li>{{ s }}</li>
            {% endfor %}
        </ul>
    </div>
    {% endif %}
</div>
</body>
</html>
